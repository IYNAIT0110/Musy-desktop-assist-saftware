name: Build and release Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:win
      - name: Check Electron asset IPC with isolated data
        run: node node_modules/electron/cli.js tests/treasureElectron.smoke.cjs --disable-gpu
      - run: node scripts/check-package.cjs
      - name: Smoke test installer on clean Windows runner
        run: node scripts/smoke-win.js
      - name: Package documentation
        shell: pwsh
        run: ./scripts/package-docs.ps1
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/* -File | Where-Object { $_.Extension -in '.exe','.zip' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musy-windows
          path: |
            dist/*.exe
            dist/*-docs.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = @((Get-ChildItem dist/*.exe).FullName) + @((Get-ChildItem dist/*-docs.zip).FullName) + @('dist/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Musy $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md" --latest
